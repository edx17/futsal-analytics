    default-src 'self'; 
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.youtube.com; 
    connect-src 'self' http://127.0.0.1:* http://localhost:* wss://*.supabase.co https://*.supabase.co https://*.supabase.in https://*.ngrok-free.dev https://*.ngrok-free.app https://*.onrender.com;

  <meta name="theme-color" content="#000000">

  <!-- El nombre que queda debajo del icono cuando la app se instala. Android lo
       toma del "short_name" del manifest; iOS ignora el manifest y usa esta meta,
       asi que las dos tienen que decir lo mismo o el icono se llama distinto
       segun el telefono. -->
  <meta name="application-name" content="VirtualClub">
  <meta name="apple-mobile-web-app-title" content="VirtualClub">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <title>Virtual.Club — La app de tu club de futsal</title>

  <!-- Cómo se ve el link cuando alguien lo comparte. Sin esto, pasar
       virtual-club.ar por WhatsApp muestra una URL pelada, sin imagen ni
       explicación, y es justo así como se difunde este producto. -->
  <meta name="description" content="Citación, presentismo, lesiones y análisis del partido. Toda la semana de tu club de futsal en un solo lugar. Probala gratis 30 días." />
